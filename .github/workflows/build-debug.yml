name: Build SchachNova debug APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Generate checksum and source archive
        run: |
          cd app/build/outputs/apk/debug
          sha256sum app-debug.apk > SHA256SUMS.txt
          cd "$GITHUB_WORKSPACE"
          git archive --format=zip --output=SchachNova-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: SchachNova-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
            SchachNova-source.zip
          retention-days: 90
