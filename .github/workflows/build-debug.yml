name: Build SchachNova debug APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          test -d "$ANDROID_SDK_ROOT"
          ls "$ANDROID_SDK_ROOT/platforms"
      - name: Bundle offline Stockfish engine
        run: |
          npm pack stockfish@19.0.0 --pack-destination /tmp
          mkdir -p /tmp/sf-package
          tar -xzf /tmp/stockfish-19.0.0.tgz -C /tmp/sf-package
          find /tmp/sf-package/package -iname '*lite*single*' -type f
          JS=$(find /tmp/sf-package/package -name 'stockfish-19-lite-single.js' -type f | head -1)
          WASM=$(find /tmp/sf-package/package -name 'stockfish-19-lite-single.wasm' -type f | head -1)
          test -n "$JS" && test -n "$WASM"
          cp "$JS" app/src/main/assets/stockfish-19-lite-single.js
          cp "$WASM" app/src/main/assets/stockfish-19-lite-single.wasm
          curl -fsSL https://www.gnu.org/licenses/gpl-3.0.txt -o app/src/main/assets/STOCKFISH-GPLv3.txt
          test -s app/src/main/assets/stockfish-19-lite-single.js && test -s app/src/main/assets/stockfish-19-lite-single.wasm
      - name: Check JavaScript syntax
        run: |
          node --check app/src/main/assets/chess.js
          node --check app/src/main/assets/stockfish-bridge.js
      - name: Run chess rule regression tests
        run: node tests/chess-rules.test.cjs
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Generate checksum and source archive
        run: |
          cd app/build/outputs/apk/debug
          sha256sum app-debug.apk > SHA256SUMS.txt
          cd "$GITHUB_WORKSPACE"
          git archive --format=zip --output=SchachNova-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: SchachNova-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
            SchachNova-source.zip
          retention-days: 90
