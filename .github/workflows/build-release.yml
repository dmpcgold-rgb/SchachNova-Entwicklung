name: Build SchachNova signed release APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate launcher icons for Android densities
        run: |
          set -euo pipefail
          SOURCE=app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -s "$SOURCE"
          # Ubuntu runners may not provide ImageMagick's legacy 'convert'.
          # Android SDK's bundled Java is available from setup-java.
          cat > /tmp/SchachNovaResizeIcon.java <<'JAVA'
          import java.awt.*;
          import java.awt.image.BufferedImage;
          import java.io.File;
          import javax.imageio.ImageIO;
          public class SchachNovaResizeIcon {
            public static void main(String[] args) throws Exception {
              BufferedImage src = ImageIO.read(new File(args[0]));
              if (src == null) throw new IllegalArgumentException("Invalid launcher PNG");
              int size = Integer.parseInt(args[2]);
              BufferedImage dst = new BufferedImage(size,size,BufferedImage.TYPE_INT_ARGB);
              Graphics2D g = dst.createGraphics();
              g.setRenderingHint(RenderingHints.KEY_INTERPOLATION,RenderingHints.VALUE_INTERPOLATION_BICUBIC);
              g.setRenderingHint(RenderingHints.KEY_RENDERING,RenderingHints.VALUE_RENDER_QUALITY);
              g.drawImage(src,0,0,size,size,null);
              g.dispose();
              ImageIO.write(dst,"png",new File(args[1]));
            }
          }
          JAVA
          javac /tmp/SchachNovaResizeIcon.java
          for spec in hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            density="${spec%%:*}"
            pixels="${spec##*:}"
            mkdir -p "app/src/main/res/mipmap-$density"
            java -cp /tmp SchachNovaResizeIcon "$SOURCE" "app/src/main/res/mipmap-$density/ic_launcher.png" "$pixels"
          done
      - name: Verify permanent release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.SCHACHNOVA_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SCHACHNOVA_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SCHACHNOVA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SCHACHNOVA_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::Missing SCHACHNOVA_KEYSTORE_BASE64"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "::error::Missing SCHACHNOVA_STORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::Missing SCHACHNOVA_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Missing SCHACHNOVA_KEY_PASSWORD"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/schachnova-release.jks"
          echo "SCHACHNOVA_KEYSTORE_PATH=$RUNNER_TEMP/schachnova-release.jks" >> "$GITHUB_ENV"
          echo "SCHACHNOVA_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SCHACHNOVA_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SCHACHNOVA_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Bundle Stockfish 19 offline
        run: |
          npm pack stockfish@19.0.0 --pack-destination /tmp
          mkdir -p /tmp/sf-package
          tar -xzf /tmp/stockfish-19.0.0.tgz -C /tmp/sf-package
          cp "$(find /tmp/sf-package/package -name stockfish-19-lite-single.js -type f | head -1)" app/src/main/assets/
          cp "$(find /tmp/sf-package/package -name stockfish-19-lite-single.wasm -type f | head -1)" app/src/main/assets/
          cp "$(find /tmp/sf-package/package -maxdepth 3 -type f \( -iname 'COPYING*' -o -iname 'LICENSE*' \) | head -1)" app/src/main/assets/STOCKFISH-GPLv3.txt
      - name: Bundle Fairy-Stockfish
        run: |
          bash scripts/install-fairy-stockfish.sh
          node scripts/test-fairy-uci.cjs "$PWD/app/src/main/assets/fairy-stockfish-core.js"
      - name: Check all JavaScript sources
        run: |
          find app/src/main/assets -maxdepth 1 -name '*.js' ! -name 'stockfish-19-lite-single.js' ! -name 'fairy-stockfish.js' -print0 | xargs -0 -n1 node --check
      - name: Run chess regression tests
        run: |
          node tests/chess-rules.test.cjs
          node tests/variant-integration.test.cjs
          node tests/variant-moves.test.cjs
          node tests/torpedo-regression.test.cjs
          node tests/board-geometry.test.cjs
          node tests/rectangular-rules.test.cjs
          node tests/rectangular-legality.test.cjs
          node tests/rectangular-special-moves.test.cjs
          node tests/rectangular-castling.test.cjs
          node tests/rectangular-preview.test.cjs
          node tests/memory-check-legality.test.cjs
          node tests/endgame-result.test.cjs
      - name: Synchronize visible version with Android versionName
        run: |
          set -euo pipefail
          VERSION=$(sed -nE 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -1)
          test -n "$VERSION" || { echo "::error::Cannot read Android versionName"; exit 1; }
          VERSION="$VERSION" python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path("app/src/main/assets/index.html")
          html=p.read_text()
          import re
          html,n=re.subn(r'(<span id="schachnovaVersion">)[^<]*(</span>)',lambda m:m.group(1)+os.environ["VERSION"]+m.group(2),html)
          if n!=1: raise SystemExit("Version label missing or duplicated")
          p.write_text(html)
          PY
      - name: Assemble signed release APK
        run: gradle :app:assembleRelease --no-daemon
      - name: Verify release APK signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK" > app/build/outputs/apk/release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SchachNova-release-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
          retention-days: 90
