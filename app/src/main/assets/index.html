<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;background:#171c1e;color:#f6f5ed;font:16px system-ui,sans-serif;padding:16px}main{max-width:580px;margin:auto}h1{margin:6px 0 14px}.board{display:grid;grid-template-columns:repeat(8,1fr);width:100%;aspect-ratio:1;border-radius:12px;overflow:hidden}.sq{border:0;display:grid;place-items:center;font-size:clamp(23px,8vw,52px);padding:0;min-width:0;user-select:none}.light{background:#ede9d6;color:#151515}.dark{background:#82916d;color:#151515}.selected{box-shadow:inset 0 0 0 5px #eab308}.target{box-shadow:inset 0 0 0 5px #16a34a}.status{padding:12px 0;font-weight:600}.clock{font-size:25px;font-variant-numeric:tabular-nums;padding:10px 0}.controls{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.controls button{border:0;border-radius:10px;padding:12px;background:#e8ab4e;color:#171717;font-weight:700}p{color:#b7c2bd;font-size:13px}</style></head><body><main><h1>♞ SchachNova</h1><div class="clock">Schwarz: <span id="blackClock">10:00</span></div><div id="board" class="board" aria-label="Schachbrett"></div><div class="clock">Weiß: <span id="whiteClock">10:00</span></div><div id="status" class="status">Weiß am Zug</div><div class="controls"><button id="startClock">Uhr starten</button><button id="undo">Zug zurück</button><button id="newGame">Neue Partie</button></div><p>Lokaler Zwei-Spieler-Modus · 10 Minuten pro Seite · Entwicklungsversion</p></main><script src="chess.js"></script></body></html>
