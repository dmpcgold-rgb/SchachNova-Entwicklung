<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;background:#161b1d;color:#f5f4ee;font:16px system-ui,sans-serif;padding:18px}main{max-width:580px;margin:auto}h1{margin:8px 0 4px}p{color:#b9c2bd;line-height:1.5}.board{display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:1;border-radius:12px;overflow:hidden}.sq{display:grid;place-items:center;font-size:clamp(23px,8vw,52px);user-select:none}.light{background:#ede9d6;color:#141414}.dark{background:#82916d;color:#141414}.status{padding:14px 0;font-weight:600}
</style></head><body><main><h1>♞ SchachNova</h1><p>Version 1.0.0-dev · Neues Android-Grundprojekt</p><div class="status">Brettvorschau – Spielzüge noch nicht freigeschaltet</div><div class="board" id="board" aria-label="Schachbrett"></div><p>Als Nächstes: vollständige Schachregeln, Schachuhr und automatisierte Tests.</p></main><script>
const rows=['rnbqkbnr','pppppppp','........','........','........','........','PPPPPPPP','RNBQKBNR'];
const glyph={K:'♔',Q:'♕',R:'♖',B:'♗',N:'♘',P:'♙',k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟','.':''};
for(let r=0;r<8;r++)for(let c=0;c<8;c++){const cell=document.createElement('div');cell.className='sq '+((r+c)%2?'dark':'light');cell.textContent=glyph[rows[r][c]];document.getElementById('board').append(cell)}
</script></body></html>
