<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1715"><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0b1715;color:#eef5ee;font-family:system-ui,-apple-system,sans-serif}body{padding:12px}main{max-width:620px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 16px;border-bottom:1px solid #29423a;margin-bottom:12px}h1{font-size:clamp(26px,7vw,36px);letter-spacing:-1px;margin:0}.brand{color:#a9ecaa}.logo{display:inline-grid;place-items:center;width:46px;height:46px;border:1px solid #426c53;border-radius:50%;background:#173629;color:#a7edaa;margin-right:10px}.top{display:flex;align-items:center}.tag{color:#a9c4b5;font-size:12px}.panel{background:linear-gradient(150deg,#192d28,#101e1b);border:1px solid #355148;border-radius:22px;padding:12px;box-shadow:0 8px 24px #0004}.player{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}.player strong{font-size:17px}.clock{font-size:22px;font-weight:750;font-variant-numeric:tabular-nums;color:#d9f3dd}.status{font-weight:750;color:#e6f4e8;margin-bottom:10px}.boardwrap{padding:4px;border:1px solid #405b4c;border-radius:15px;background:#12251e}.board{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));width:100%;aspect-ratio:1;overflow:hidden;border-radius:10px}.sq{border:0;display:grid;place-items:center;font-size:clamp(27px,9vw,62px);padding:0;min-width:0;user-select:none;line-height:1;touch-action:manipulation}.light{background:#f1f0d7}.dark{background:#7b9d5e}.sq.white-piece{color:#f9f9f3;-webkit-text-stroke:1.3px #474747;text-shadow:1px 2px 1px #555,0 3px 2px #2228}.sq.black-piece{color:#4d4c50;-webkit-text-stroke:1.3px #222;text-shadow:1px 2px 1px #111,0 3px 2px #0008}.lastmove{background:#c3cc53!important}.selected{box-shadow:inset 0 0 0 4px #f8d54b}.target{box-shadow:inset 0 0 0 4px #2a5c35}.controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:12px}.controls button{min-height:50px;border:1px solid #48695a;border-radius:16px;padding:9px 4px;background:#24352f;color:#f1f7f0;font-weight:750;font-size:14px}.controls button.primary{background:linear-gradient(145deg,#347d4e,#1b5b3a);border-color:#5d9a70}.controls button:active{filter:brightness(1.25)}.section{margin-top:12px;padding:12px;border:1px solid #30483d;border-radius:16px;background:#14241f}.section h2{font-size:15px;margin:0 0 8px}.muted{color:#a9c0b3;font-size:12px}.footer{margin-top:12px;text-align:center;color:#a9c0b3;font-size:12px}@media(min-width:650px){body{padding:20px}.sq{font-size:64px}} 
</style></head><body><main><header><div class="top"><span class="logo">♞</span><h1>Schach<span class="brand">Nova</span></h1></div><span class="tag">● LOKAL</span></header><section class="panel"><div class="player"><div><strong>♚ Schwarz</strong><div class="muted">Spieler 2</div></div><span id="blackClock" class="clock">10:00</span></div><div id="status" class="status">Weiß am Zug</div><div class="boardwrap"><div id="board" class="board" aria-label="Schachbrett"></div></div><div class="player" style="margin:10px 0 0"><div><strong>♔ Weiß</strong><div class="muted">Spieler 1</div></div><span id="whiteClock" class="clock">10:00</span></div><div class="controls"><button class="primary" id="newGame">♙ Neue Partie</button><button id="undo">◀ Zurück</button><button id="forward">Vor ▶</button><button id="startClock">▶ Uhr starten</button><button id="addTime">+15 Sekunden</button><button id="flipBoard">↻ Drehen</button></div><div class="section"><h2>☷ Zugverlauf</h2><div id="moveHistory" class="muted">Noch keine Züge</div></div></section><div class="footer">Ungewertete Partie · Vibrationen · 10 Minuten pro Seite</div></main><script src="chess.js"></script></body></html>
